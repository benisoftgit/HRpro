# render.yaml — Render.com Blueprint
# Deploy via Render Dashboard → Blueprint (connect repo)

services:
  - type: web
    name: hrpro
    runtime: image
    repo: https://github.com/yourusername/hrpro
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: FRONTEND_URL
        value: https://hrpro.onrender.com
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
