# fly.toml — Fly.io deployment
# First deploy:
#   fly launch --dockerfile Dockerfile --name hrpro --region iad --no-deploy
#   fly secrets set SECRET_KEY=<random> DATABASE_URL=<neon-connection-string>
#   fly deploy

app = "hrpro"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_API_URL = "/api"

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = ".fly.dev,localhost"
  CORS_ALLOW_ALL_ORIGINS = "False"
  FRONTEND_URL = "https://hrpro.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
